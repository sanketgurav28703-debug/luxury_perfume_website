<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;">

<form method="POST" style="background:white;padding:30px;border-radius:10px;width:300px;">
  <h2>Admin Login</h2>

  <input type="email" name="email" placeholder="Email" required style="width:100%;padding:10px;margin:10px 0;">
  <input type="password" name="password" placeholder="Password" required style="width:100%;padding:10px;margin:10px 0;">

  <button type="submit" style="width:100%;padding:10px;background:#ff7b89;color:white;border:none;">
    Login
  </button>
</form>

</body>
</html>
